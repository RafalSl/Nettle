<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#0B7F72","#2563EB","#6D4AE0"],"section":"Look"},"bg":{"editor":"enum","default":"dots","options":["glow","dots","plain"],"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#6D4AE0';
const bg = this.props.bg ?? 'glow';
const mix = (pct, base) => 'color-mix(in srgb, ' + accent + ' ' + pct + '%, ' + base + ')';
let bgImage = 'none';
let bgSize = 'auto';
if (bg === 'glow') {
bgImage = 'radial-gradient(420px 360px at -5% -2%, ' + mix(28, 'white') + ' 0%, transparent 72%), radial-gradient(380px 420px at 108% 38%, ' + mix(16, 'white') + ' 0%, transparent 70%), radial-gradient(460px 380px at 0% 102%, ' + mix(20, 'white') + ' 0%, transparent 72%)';
} else if (bg === 'dots') {
bgImage = 'radial-gradient(circle at 1px 1px, ' + mix(30, '#F4F5F7') + ' 1.1px, transparent 1.7px), radial-gradient(420px 360px at -5% -2%, ' + mix(20, 'white') + ' 0%, transparent 72%)';
bgSize = '22px 22px, auto';
}
return {
accent,
accentTint: mix(12, 'white'),
accentDeep: 'color-mix(in srgb, ' + accent + ' 78%, black)',
bgImage,
bgSize
};
}
}
</script>
