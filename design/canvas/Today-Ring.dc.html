<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, Day ring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
@keyframes rg-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rg-draw{from{stroke-dashoffset:653.5}to{stroke-dashoffset:263.2}}
@keyframes rg-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.rg-r{animation:rg-rise .7s cubic-bezier(.2,.7,.2,1) both}
.rg-d1{animation-delay:.05s}.rg-d2{animation-delay:.2s}.rg-d3{animation-delay:.35s}.rg-d4{animation-delay:.45s}.rg-d5{animation-delay:.55s}.rg-d6{animation-delay:.65s}
.rg-arc{animation:rg-draw 1.4s cubic-bezier(.3,.6,.2,1) .3s both}
.rg-dot{transform-box:fill-box;transform-origin:center;animation:rg-pop .45s cubic-bezier(.3,1.6,.5,1) both}
.rg-p1{animation-delay:.9s}.rg-p2{animation-delay:1.05s}.rg-p3{animation-delay:1.2s}.rg-p4{animation-delay:1.5s}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background-color: #F6F5FB; background-image: repeating-radial-gradient(circle at 195px 260px, transparent 0, transparent 37px, {{ringLine}} 37px, {{ringLine}} 38px), radial-gradient(520px 420px at 50% 22%, #FFFFFF 0%, transparent 70%), linear-gradient(to bottom, #FFFFFF, {{haze}}); font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif; color: #16131F; -webkit-font-smoothing: antialiased">

<svg aria-hidden="true" width="0" height="0" style="position: absolute">
<defs>
<linearGradient id="rgWash" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="22"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.5"/></linearGradient>
<linearGradient id="rgWashMeal" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="17"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.55"/></linearGradient>
</defs>
</svg>

<div style="position: absolute; inset: 0; padding: 56px 20px 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

<!-- Header -->
<div class="rg-r rg-d1" style="display: flex; align-items: center; justify-content: space-between; padding-left: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">Today</h1>
<button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 8px 22px rgba(22,19,31,0.08); display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
</button>
</div>

<!-- Day ring -->
<div class="rg-r rg-d2" style="position: relative; display: flex; justify-content: center; align-items: center; height: 280px">
<button aria-label="Previous day" style="position: absolute; left: 0; top: 118px; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 8px 22px rgba(22,19,31,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<button aria-label="Next day, not available" disabled style="position: absolute; right: 0; top: 118px; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; opacity: 0.4; display: flex; align-items: center; justify-content: center; cursor: default"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>

<div style="position: relative; width: 280px; height: 280px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(22,19,31,0.04), 0 24px 60px {{shadowTint}}">
<svg role="img" aria-label="Today on a 24 hour dial: treatment at 09:10, meal at 12:40, stool at 13:05, now 14:20" width="280" height="280" viewBox="-10 -10 280 280" style="position: absolute; inset: 0">
<circle cx="130" cy="130" r="104" fill="none" stroke="#EEECF5" stroke-width="10"/>
<circle cx="130" cy="130" r="80" fill="none" stroke="#F3F1F8" stroke-width="10"/>
<circle class="rg-arc" cx="130" cy="130" r="104" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="263.2" transform="rotate(-90 130 130)" opacity="0.9"/>
<g fill="#8A8597" font-family="Instrument Sans, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
<text x="130" y="7">00</text><text x="256" y="134">06</text><text x="130" y="262">12</text><text x="4" y="134">18</text>
</g>
<g class="rg-dot rg-p1"><circle cx="184" cy="189" r="8.5" fill="#FFFFFF" stroke="#16131F" stroke-width="2"/></g>
<g class="rg-dot rg-p2"><circle cx="111.9" cy="232.4" r="8.5" fill="#16131F"/></g>
<g class="rg-dot rg-p3"><circle cx="107.6" cy="206.8" r="8.5" fill="#FFFFFF" stroke="#16131F" stroke-width="2"/></g>
<g class="rg-dot rg-p4"><circle cx="70.35" cy="215.2" r="5" fill="#FFFFFF" stroke="{{accent}}" stroke-width="3"/></g>
</svg>
<button aria-label="Jump to a date" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); display: flex; flex-direction: column; align-items: center; text-align: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 76px; line-height: 72px; font-weight: 800; letter-spacing: -3px">14</span>
<span style="font-size: 14px; font-weight: 600; color: #5E5970; margin-top: 2px">Saturday, Nov</span>
<span style="font-size: 12.5px; font-weight: 600; color: {{accentDeep}}; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: {{accentTint}}">3 entries · 14:20</span>
</button>
</div>
</div>

<div class="rg-r rg-d3" style="display: flex; justify-content: center; gap: 18px; margin-top: -4px; font-size: 12.5px; font-weight: 500; color: #5E5970">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #16131F"></span>Intake, outer</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 999px; box-shadow: inset 0 0 0 2px #16131F"></span>Body and care, inner</span>
</div>

<!-- Hero field -->
<div class="rg-r rg-d3" style="display: flex; align-items: center; height: 58px; padding: 0 7px 0 20px; gap: 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 12px 30px rgba(22,19,31,0.09)">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5970" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<button aria-label="Log anything" style="flex: 1; min-width: 0; height: 44px; font-size: 16px; color: #5E5970">What do you want to log?</button>
<button aria-label="Scan a barcode or label" style="width: 44px; height: 44px; border-radius: 999px; background: #16131F; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M4 6v12M8 6v12M11 6v12M15 6v12M18 6v12M20.5 6v12"/></svg></button>
</div>

<!-- Quick actions: one scrolling row -->
<div class="rg-r rg-d4" style="display: flex; flex-direction: column; gap: 8px; margin: 0 -20px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700">Quick actions</h2>
<button style="height: 32px; padding: 0 6px; font-size: 14px; font-weight: 600; color: {{accentDeep}}">Edit</button>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 10px 20px">
<button style="height: 50px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 6px 16px rgba(22,19,31,0.07)"><span style="width: 38px; height: 38px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 16 0Z" fill="url(#rgWashMeal)"/><path d="M2.5 20.5h19"/><path d="M12 9V7"/><circle cx="12" cy="5.8" r="1.2"/></svg></span><span style="font-size: 15px; font-weight: 600">Meal</span></button>
<button style="height: 50px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 6px 16px rgba(22,19,31,0.07)"><span style="width: 38px; height: 38px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12H22V14a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15L6 14Z" fill="url(#rgWash)" stroke="none"/><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span><span style="font-size: 15px; font-weight: 600">Skin</span></button>
<button style="height: 50px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 6px 16px rgba(22,19,31,0.07)"><span style="width: 38px; height: 38px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" fill="url(#rgWash)"/><path d="m8.5 8.5 7 7"/></svg></span><span style="font-size: 15px; font-weight: 600">Treatment</span></button>
<button style="height: 50px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 6px 16px rgba(22,19,31,0.07)"><span style="width: 38px; height: 38px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="url(#rgWash)"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span><span style="font-size: 15px; font-weight: 600">Daily health</span></button>
<button style="height: 50px; flex: none; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 6px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 6px 16px rgba(22,19,31,0.07)"><span style="width: 38px; height: 38px; border-radius: 999px; background: {{accentTint}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="15.5" width="17" height="5" rx="2.5" transform="rotate(-3 12 18)" fill="url(#rgWash)"/><rect x="6" y="10.5" width="12" height="5" rx="2.5" transform="rotate(3 12 13)" fill="url(#rgWash)"/><rect x="8.5" y="6" width="7" height="4.5" rx="2.25" transform="rotate(-4 12 8)" fill="url(#rgWash)"/><path d="M12 6c0-1.6.8-2.6 2.2-3.2"/></svg></span><span style="font-size: 15px; font-weight: 600">Stool</span></button>
<button style="height: 50px; flex: none; border-radius: 999px; background: transparent; display: flex; align-items: center; gap: 8px; padding: 0 18px; box-shadow: inset 0 0 0 1.5px #DCD8E6"><span style="font-size: 15px; font-weight: 600">More</span></button>
</div>
</div>

<!-- Context: compact signal pills -->
<div class="rg-r rg-d5" style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 8px; border-radius: 999px; background: #FDECE7; color: #9A2E12; font-size: 14px; font-weight: 600"><span style="width: 26px; height: 26px; border-radius: 999px; background: #C2410C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700">8</span>Flare: Chin since 12 Nov</button>
<button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; background: #16131F; color: #FFFFFF; font-size: 14px; font-weight: 600">Daily health: add</button>
</div>

<!-- One-tap treatments -->
<div class="rg-r rg-d6" style="display: flex; gap: 8px; flex-wrap: wrap">
<button aria-label="Apply Emollient to Chin and Neck" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 1.5px {{accentTint2}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span style="font-size: 14px; font-weight: 600">Emollient</span><span style="font-size: 13.5px; color: #5E5970">Chin, Neck</span></button>
<button aria-label="Apply Lotion to Ears" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 1.5px {{accentTint2}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accentDeep}}" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span style="font-size: 14px; font-weight: 600">Lotion</span><span style="font-size: 13.5px; color: #5E5970">Ears</span></button>
</div>

<!-- Log list, below the ring -->
<div class="rg-r rg-d6" style="display: flex; flex-direction: column; gap: 0; background: #FFFFFF; border-radius: 28px; padding: 4px 16px; box-shadow: 0 1px 2px rgba(22,19,31,0.06), 0 8px 22px rgba(22,19,31,0.07); -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 100%); mask-image: linear-gradient(to bottom, #000 30%, transparent 100%)">
<button style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #F0EEF5"><span style="width: 10px; height: 10px; border-radius: 999px; box-shadow: inset 0 0 0 2px #16131F; flex: none"></span><span style="flex: 1; font-size: 15px; font-weight: 600">Stool, type 4</span><span style="font-size: 11.5px; font-weight: 700; color: {{accentDeep}}; background: {{accentTint}}; padding: 3px 8px; border-radius: 999px">New</span><span style="font-size: 13.5px; color: #5E5970; font-variant-numeric: tabular-nums">13:05</span></button>
<button style="display: flex; align-items: center; gap: 12px; height: 52px"><span style="width: 10px; height: 10px; border-radius: 999px; background: #16131F; flex: none"></span><span style="flex: 1; font-size: 15px; font-weight: 600">Chicken salad <span style="font-weight: 400; color: #5E5970">egg, mustard</span></span><span style="font-size: 13.5px; color: #5E5970; font-variant-numeric: tabular-nums">12:40</span></button>
</div>

</div>

<!-- Floating tab bar -->
<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px; background: #16131F; border-radius: 999px; box-shadow: 0 18px 40px rgba(22,19,31,0.28)">
<a href="Today-Ring.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: #16131F; text-decoration: none; font-size: 15px; font-weight: 700">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16131F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Today</a>
<a href="Today-Ring.dc.html" style="display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 999px; color: #D9D6E3; text-decoration: none; font-size: 15px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9D6E3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v-9M12 20V5M18 20v-6"/></svg>Review</a>
</div>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D4AE0","options":["#6D4AE0","#0B7F72","#2563EB"],"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#6D4AE0';
const mix = (pct, base) => 'color-mix(in srgb, ' + accent + ' ' + pct + '%, ' + base + ')';
return {
accent,
accentTint: mix(12, 'white'),
accentTint2: mix(26, 'white'),
accentDeep: 'color-mix(in srgb, ' + accent + ' 78%, black)',
haze: mix(10, '#F6F5FB'),
ringLine: mix(10, 'transparent'),
shadowTint: mix(22, 'transparent')
};
}
}
</script>
</body>
</html>
