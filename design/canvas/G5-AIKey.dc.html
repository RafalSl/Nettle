<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: AI key, saved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;border:0;background:none;outline:none;margin:0;padding:0}
input::placeholder{color:#9AA4B2}
@keyframes ax-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ax-sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes ax-drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.12)}}
@keyframes ax-drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-20px) scale(1.08)}}
.ax-r{animation:ax-rise .6s cubic-bezier(.2,.7,.2,1) both}
.ax-s{animation:ax-sheet .5s cubic-bezier(.2,.8,.2,1) both}
.ax-d1{animation-delay:.05s}.ax-d2{animation-delay:.15s}.ax-d3{animation-delay:.25s}.ax-d4{animation-delay:.35s}.ax-d5{animation-delay:.45s}
.ax-b1{animation:ax-drift1 18s ease-in-out infinite}.ax-b2{animation:ax-drift2 22s ease-in-out infinite}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #070B12; font-family: Gabarito, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F2F5F9; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div class="ax-b1" style="position: absolute; left: -120px; top: -120px; width: 420px; height: 380px; border-radius: 999px; background: {{glowA}}; filter: blur(70px); opacity: 0.5"></div>
<div class="ax-b2" style="position: absolute; right: -160px; top: 300px; width: 380px; height: 360px; border-radius: 999px; background: {{glowB}}; filter: blur(80px); opacity: 0.34"></div>
<div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 1.5px); background-size: 24px 24px"></div>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute">
<defs>
<linearGradient id="axWash" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="22"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.7"/></linearGradient>
<linearGradient id="axNail" gradientUnits="userSpaceOnUse" x1="0" y1="2.5" x2="0" y2="9.5"><stop offset="0" stop-color="{{accent}}" stop-opacity="0.95"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.45"/></linearGradient>
<linearGradient id="axWashMeal" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="17"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.75"/></linearGradient>
</defs>
</svg>
<div style="position: absolute; inset: 0; padding: 54px 20px 120px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px"><div class="ax-r ax-d1" style="display: flex; align-items: center; gap: 12px"><button aria-label="Back to Settings" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.8px">AI key</h1><div style="font-size: 14px; color: #9AA4B2; margin-top: 2px">AI</div></div></div><div class="ax-r ax-d1"><div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 28px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px)"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.5" fill="url(#axWash)"/><path d="M11.2 11.8 20 3M17 6l2.5 2.5M14.5 8.5 16.5 10.5"/></svg></span><div><div style="font-size: 15.5px; font-weight: 700">Key saved</div><div style="font-size: 13.5px; color: #9AA4B2; font-variant-numeric: tabular-nums">sk-ant-…••••9f2c</div></div></div></div></div><div class="ax-r ax-d2" style="display: flex; flex-direction: column; gap: 8px"><button style="width: 100%; height: 52px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); font-weight: 600; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Test the key (sends one request)</button><button style="width: 100%; height: 52px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); font-weight: 600; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="7" height="7" rx="2"/><rect x="13.5" y="4" width="7" height="7" rx="2" fill="url(#axWash)"/><rect x="3.5" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h6M17 14.5v6"/></svg>Replace key</button><button style="width: 100%; height: 52px; padding: 0 18px; border-radius: 999px; background: rgba(255,138,107,0.12); box-shadow: inset 0 0 0 1px rgba(255,138,107,0.40); color: #FF8A6B; font-weight: 700; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 3.5h4M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg>Remove key</button></div><p style="margin: 0; font-size: 13.5px; line-height: 20px; color: #9AA4B2">Testing sends one tiny request to Anthropic and may cost a fraction of a cent.</p></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEAD4","options":["#5EEAD4","#A3E635","#C4B5FD"],"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5EEAD4';
return {
accent,
accentSoft: 'color-mix(in srgb, ' + accent + ' 16%, transparent)',
accentLine: 'color-mix(in srgb, ' + accent + ' 45%, transparent)',
glowA: 'radial-gradient(circle, ' + accent + ' 0%, transparent 70%)',
glowB: 'radial-gradient(circle, #6D4AE0 0%, transparent 70%)'
};
}
}
</script>
</body>
</html>
