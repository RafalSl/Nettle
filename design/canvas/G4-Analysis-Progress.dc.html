<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI analysis: running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;border:0;background:none;outline:none;margin:0;padding:0}
input::placeholder{color:#9AA4B2}
@keyframes ax-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ax-sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes ax-drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.12)}}
@keyframes ax-drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-20px) scale(1.08)}}
.ax-r{animation:ax-rise .6s cubic-bezier(.2,.7,.2,1) both}
.ax-s{animation:ax-sheet .5s cubic-bezier(.2,.8,.2,1) both}
.ax-d1{animation-delay:.05s}.ax-d2{animation-delay:.15s}.ax-d3{animation-delay:.25s}.ax-d4{animation-delay:.35s}.ax-d5{animation-delay:.45s}
.ax-b1{animation:ax-drift1 18s ease-in-out infinite}.ax-b2{animation:ax-drift2 22s ease-in-out infinite}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #070B12; font-family: Gabarito, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #F2F5F9; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div class="ax-b1" style="position: absolute; left: -120px; top: -120px; width: 420px; height: 380px; border-radius: 999px; background: {{glowA}}; filter: blur(70px); opacity: 0.5"></div>
<div class="ax-b2" style="position: absolute; right: -160px; top: 300px; width: 380px; height: 360px; border-radius: 999px; background: {{glowB}}; filter: blur(80px); opacity: 0.34"></div>
<div style="position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 1.5px); background-size: 24px 24px"></div>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute">
<defs>
<linearGradient id="axWash" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="22"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.7"/></linearGradient>
<linearGradient id="axNail" gradientUnits="userSpaceOnUse" x1="0" y1="2.5" x2="0" y2="9.5"><stop offset="0" stop-color="{{accent}}" stop-opacity="0.95"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.45"/></linearGradient>
<linearGradient id="axWashMeal" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="17"><stop offset="0" stop-color="{{accent}}" stop-opacity="0"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0.75"/></linearGradient>
</defs>
</svg>
<div style="position: absolute; inset: 0; padding: 54px 20px 120px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px"><div class="ax-r ax-d1" style="display: flex; align-items: center; gap: 12px"><button aria-label="Back to Review" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div style="flex: 1; min-width: 0"><h1 style="margin: 0; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -0.8px">AI analysis</h1><div style="font-size: 14px; color: #9AA4B2; margin-top: 2px">Review</div></div></div><div class="ax-r ax-d1" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px 10px 40px 10px"><div style="position: relative; width: 150px; height: 150px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; align-items: center; justify-content: center"><div style="position: absolute; inset: 14px; border-radius: 999px; border: 2px dashed rgba(255,255,255,0.14)"></div><svg aria-hidden="true" width="76" height="76" viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="17" stroke="rgba(255,255,255,0.12)" stroke-width="4"/><path d="M22 5a17 17 0 0 1 14.7 8.5" stroke="{{accent}}" stroke-width="4" stroke-linecap="round"/></svg></div><h2 style="margin: 0; font-size: 22px; font-weight: 800">Analysing…</h2><p style="margin: 0; font-size: 15px; line-height: 22px; color: #C9D0DA">This can take a few minutes. Keep the app open.</p><span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">Running for 2:10</span><span style="font-size: 13.5px; color: #9AA4B2">Sent: 45 days, 131 meals and drinks, 1 photo (not sensitive) · Haiku 5.5</span><button style="height: 52px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); font-weight: 600; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7 7 17"/></svg>Cancel analysis</button><p style="margin: 0; font-size: 13px; line-height: 19px; color: #9AA4B2">Cancel stops the request and stores nothing. Work already started may still be billed.</p></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEAD4","options":["#5EEAD4","#A3E635","#C4B5FD"],"section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5EEAD4';
return {
accent,
accentSoft: 'color-mix(in srgb, ' + accent + ' 16%, transparent)',
accentLine: 'color-mix(in srgb, ' + accent + ' 45%, transparent)',
glowA: 'radial-gradient(circle, ' + accent + ' 0%, transparent 70%)',
glowB: 'radial-gradient(circle, #6D4AE0 0%, transparent 70%)'
};
}
}
</script>
</body>
</html>
